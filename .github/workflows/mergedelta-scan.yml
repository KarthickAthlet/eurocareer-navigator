# .github/workflows/mergedelta-scan.yml — generated by MergeDelta setup (spec 0b-4 §4.1).
#
# UNPRIVILEGED. Runs code the PR controls. Has NO secrets and a read-only token.
# It only measures and uploads one artifact; mergedelta-publish.yml does everything that
# needs trust. The scan action (mode: scan) writes shipguard-artifact.json; nothing else.
name: MergeDelta scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ["main"]            # default branch → baseline snapshots (0b-2 §5.2)
  workflow_dispatch: {}         # baseline at install (PLAN §6)

permissions:
  contents: read                # the ONLY permission: read the repo to build

concurrency:
  # PRs: newest push wins. Default branch: never cancel, so every merge-base gets a snapshot.
  group: mergedelta-scan-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The production URL and the preview URL pattern (MergeDelta setup filled these in).
  MERGEDELTA_PRODUCTION_URL: "https://eurocareer-navigator.netlify.app"
  MERGEDELTA_PREVIEW_URL_PATTERN: "https://deploy-preview-{pr}--eurocareer-navigator.netlify.app"
  MERGEDELTA_VERSION_MARKER_PATH: "/version.txt"

jobs:
  scan:
    runs-on: ubuntu-24.04       # pinned OS (PLAN §9); never a self-hosted runner for PR code
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — pinned by SHA (PLAN §9)
        with:
          persist-credentials: false             # don't leave the token in .git/config
          fetch-depth: 0                         # needed for the in-job merge-base fallback

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      # Does the config use localBuild? When it does, the scan builds and serves BOTH sides
      # itself — no preview to wait for. The wait step is skipped (jq reads perf.config.json),
      # and base-url/pr-url are passed only so the scan can fall back to production-paired.
      - name: Does the config use localBuild?
        if: github.event_name == 'pull_request'
        id: localbuild
        run: |
          if jq -e '.localBuild != null' perf.config.json >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the deploy preview to serve this PR's head commit
        if: github.event_name == 'pull_request' && steps.localbuild.outputs.enabled != 'true'
        shell: bash
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          URL="${MERGEDELTA_PREVIEW_URL_PATTERN//\{pr\}/$PR}"
          for i in $(seq 1 60); do
            GOT=$(curl -fsS "$URL${MERGEDELTA_VERSION_MARKER_PATH}" 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$GOT" = "$HEAD_SHA" ]; then
              echo "Preview is ready: $URL"
              echo "PREVIEW_URL=$URL" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Waiting for $URL to serve $HEAD_SHA (got '${GOT:-nothing}')…"
            sleep 10
          done
          echo "The deploy preview did not appear within 10 minutes." >&2
          exit 1

      # The MergeDelta scan action, pinned by full commit SHA (1b-1 D4). No api-key, no
      # api-url, no tokens: this job talks to nothing but the site under test.
      - name: MergeDelta scan
        uses: mergedelta/action/scan@53863d33040e9301c097a187c98ecd23000bbb14 # v1.3.3
        with:
          # No api-key, no api-url, no tokens: this job talks to nothing but the site under test.
          # base-url/pr-url are the production-paired FALLBACK (used when localBuild fails or is
          # not configured); in strict mode the action serves both sides on localhost itself.
          base-url: ${{ env.MERGEDELTA_PRODUCTION_URL }}
          pr-url: ${{ env.PREVIEW_URL }}
          config: perf.config.json
          mode: scan
          output: shipguard-artifact.json
          build-timeout: 10

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shipguard-artifact
          path: shipguard-artifact.json
          retention-days: 7
          if-no-files-found: error
