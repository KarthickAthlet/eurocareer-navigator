# .github/workflows/mergedelta-publish.yml — generated by MergeDelta setup (spec 0b-4 §4.2, 1b-1 §4 + amendment A1).
#
# PRIVILEGED. Runs the default branch's copy of this file (workflow_run always does), never
# PR code. Validates the scan artifact as untrusted input, verifies identity against GitHub,
# gets a short-lived MergeDelta credential via OIDC, runs the diff, and posts the comment and
# check AS THE MERGEDELTA APP through the backend's /publish-api/post (poster: app). The job
# makes NO GitHub write calls, so the permissions block drops pull-requests/checks writes.
name: MergeDelta publish

on:
  workflow_run:
    workflows: [MergeDelta scan]   # by name; the action also checks the workflow path (trust.ts)
    types: [completed]

permissions:
  contents: read
  actions: read          # download the scan run's artifact
  pull-requests: read    # read the PR (head, base, changed files); NO write — the App posts
  id-token: write        # OIDC → short-lived MergeDelta ingest token (no stored secret)
# No checks: write, no pull-requests: write — the MergeDelta App posts through the backend.

concurrency:
  group: mergedelta-publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The public action repository (1b-1 D4), pinned by full commit SHA. Checkout is NOT
      # needed: actions/checkout is for the repository's own files; the action runs from the
      # public repo's dist/index.js referenced by the `uses:` line below.
      - name: MergeDelta publish
        uses: mergedelta/action/publish@b8d2a22b70c9645c3d8d0900400689e06197f213 # v1.3.2
        with:
          github-token: ${{ github.token }}   # reads only: artifact, PRs, files, compare
          mergedelta-api: "https://ietochxecbljqodazkik.supabase.co/functions/v1"
          poster: app
          # task 2-7 item 3: the blocking thresholds are read at the TRUSTED merge-base
          # SHA through the contents API (contents: read above) — never at the PR head.
          config: perf.config.json
